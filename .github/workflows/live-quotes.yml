# Publie les derniers cours de l'univers SFC (toutes les ~5 min) sur la branche « live » : lue directement par l'app.
name: cours en direct
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live-quotes
  cancel-in-progress: true
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/live/quotes.mjs
      - name: Publier sur la branche live (un seul commit, pas d'historique)
        run: |
          mkdir ../out && cp quotes.json ../out/ && cd ../out
          git init -q -b live
          git config user.name "live-quotes"
          git config user.email "actions@users.noreply.github.com"
          git add quotes.json && git commit -qm "cours $(date -u +%H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
